name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - production # Proses deploy hanya berjalan jika Anda melakukan push ke branch production

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Direktori tujuan di cPanel (kosongkan jika FTP user sudah diarahkan langsung ke public_html/tgm_erp)
          # server-dir: /public_html/tgm_erp/
          
          # Mengecualikan folder dan file agar tidak menghapus atau menimpa yang ada di server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            IMPLEMENTATION_PLAN.md
            MOBILE_RESPONSIVE_FINAL.md
            uploads/**
            error_log
            .env
            assets/app-releases/**
            flutter_example/**
            portal/**
            portal.zip
            *.apk
            *.zip
            scratch*
