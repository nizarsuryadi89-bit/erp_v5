name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/tgmprin2/repositories/erp_v5
            git pull origin main
            cp -R application /home/tgmprin2/erp.tgmprint.com/
            cp -R assets /home/tgmprin2/erp.tgmprint.com/
            cp -R system /home/tgmprin2/erp.tgmprint.com/
            cp -R vendor /home/tgmprin2/erp.tgmprint.com/
            cp index.php /home/tgmprin2/erp.tgmprint.com/
            cp .htaccess /home/tgmprin2/erp.tgmprint.com/
            echo "✅ Deploy selesai: $(date)"
