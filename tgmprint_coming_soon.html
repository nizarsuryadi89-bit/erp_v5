<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGM Print - Coming Soon</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --dark-bg: #0b0c10;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-light: #ffffff;
            --text-muted: #8892b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Gradients */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,210,255,0.15) 0%, rgba(11,12,16,0) 70%);
            top: -200px;
            left: -200px;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite alternate;
            z-index: 0;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(58,123,213,0.15) 0%, rgba(11,12,16,0) 70%);
            bottom: -150px;
            right: -100px;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
        }

        /* Brand / Title */
        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 20px rgba(0,210,255,0.2); }
            100% { text-shadow: 0 0 40px rgba(0,210,255,0.6); }
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* Glassmorphism Countdown */
        .countdown-wrapper {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .time-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 1.5rem;
            min-width: 120px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 210, 255, 0.2);
            border-color: rgba(0, 210, 255, 0.3);
        }

        .time-value {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .time-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            font-weight: 600;
        }

        /* Notification Form */
        .notify-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .notify-input {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 30px;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
            width: 300px;
            transition: all 0.3s ease;
        }

        .notify-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .notify-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .notify-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }

        .notify-btn:active {
            transform: scale(0.95);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .time-box {
                min-width: 90px;
                padding: 1rem;
            }
            .time-value { font-size: 2.5rem; }
            .time-label { font-size: 0.7rem; }
            .notify-container {
                flex-direction: column;
                align-items: center;
            }
            .notify-input { width: 100%; max-width: 300px; }
            .notify-btn { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <h1>TGM PRINT</h1>
        <p class="subtitle">Sesuatu yang luar biasa sedang kami persiapkan untuk Anda.</p>

        <!-- Countdown Timer -->
        <div class="countdown-wrapper">
            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Hari</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Jam</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Menit</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Detik</div>
            </div>
        </div>

        <!-- Notify Form -->
        <div class="notify-container">
            <input type="email" class="notify-input" placeholder="Masukkan email Anda..." id="emailInput">
            <button class="notify-btn" onclick="notifyMe()">Kabari Saya</button>
        </div>
    </div>

    <script>
        // Set target date 60 days from today
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 60);
        
        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate.getTime() - now;

            if (distance < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            // Calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the result with leading zeros
            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        // Update timer every second
        setInterval(updateTimer, 1000);
        updateTimer(); // initial call

        // Mock notify function
        function notifyMe() {
            const email = document.getElementById('emailInput').value;
            if (email && email.includes('@')) {
                alert('Terima kasih! Kami akan menghubungi Anda di ' + email + ' ketika website sudah siap.');
                document.getElementById('emailInput').value = '';
            } else {
                alert('Silakan masukkan alamat email yang valid.');
            }
        }
    </script>
</body>
</html>
